<!DOCTYPE HTML>
<html lang="tr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="theme-color" content="#E9EEEE">
        <title>Net Peşinde · Çevrimdışı</title>
        <style>
            body{
                margin:0;
                min-height:100vh;
                display:grid;
                place-items:center;
                background:#E9EEEE;
                color:#14181B;
                font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
                padding:1.5rem;
            }
            .kart{
                max-width:420px;
                background:#FFFFFF;
                border:1px solid #D8E2E4;
                border-radius:16px;
                padding:2rem 1.5rem;
                text-align:center;
                box-shadow:0 1px 2px rgba(20,24,27,.06), 0 8px 24px -12px rgba(20,24,27,.18);
            }
            .logo{
                font-weight:800;
                font-size:1.25rem;
                margin-bottom:1rem;
            }
            .logo span{
                background:#F1761C;
                padding:.05em .3em;
                border-radius:4px;
                margin-right:.15em;
            }
            p{
                margin:0 0 1.25rem;
                color:#55626B;
                line-height:1.6;
            }
            button{
                font:inherit;
                font-weight:700;
                border:0;
                border-radius:10px;
                padding:.7rem 1.25rem;
                background:#F1761C;
                color:#14181B;
                cursor:pointer;
            }
            @media (prefers-color-scheme:dark){
                body{ background:#101416; color:#EDF2F2; }
                .kart{ background:#191F22; border-color:#2A3438; }
                p{ color:#9BABB2; }
            }
        </style>
    </head>
    
    <body>
        <div class="kart">
            <div class="logo"><span>Net</span>Peşinde</div>
            <p>İnternet bağlantınız yok gibi görünüyor.Bağlantınız geri geldiğinde kaldığınız yerden devam edebilirsiniz.</p>
            <button type="button" onclick="location.reload()">Tekrar Dene</button>
        </div>
    </body>
</html>
